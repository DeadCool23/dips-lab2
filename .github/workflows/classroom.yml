name: GitHub Classroom Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit tests flight-service
        run: cd flight-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests ticket-service
        run: cd ticket-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests bonus-service
        run: cd bonus-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests gateway-service
        run: cd gateway-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=========== docker ps -a ==========="
          docker ps -a || true

          echo "=========== docker volume ls ==========="
          docker volume ls || true

          echo "=========== postgres inspect ==========="
          docker inspect postgres || true

          echo "=========== all logs ==========="
          docker compose logs --no-color --tail=500 || true

          echo "=========== disk / memory ==========="
          df -h || true
          free -m || true

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
