name: GitHub Classroom Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit tests flight-service
        run: cd flight-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests ticket-service
        run: cd ticket-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests bonus-service
        run: cd bonus-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests gateway-service
        run: cd gateway-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          echo "=== flight-service logs ==="
          docker compose logs flight-service || true
          echo "=== ticket-service logs ==="
          docker compose logs ticket-service || true
          echo "=== bonus-service logs ==="
          docker compose logs bonus-service || true
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
